<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Arte Registrazioni - Produzione musicale, artisti jazz, ambient e sperimentazione sonora.">
    <meta property="og:title" content="Arte Registrazioni">
    <meta property="og:description" content="Produzione musicale, progetti jazz e sperimentazione sonora.">
    <meta property="og:type" content="website">
    <meta property="og:image" content="logo.png">
    <link rel="stylesheet" href="site.css">
</head>
<body class="home-body">
            <div class="home-wrapper">
                <div class="logo-wrapper">
                    <div class="logo-stack">
                        <img src="disco.png" alt="Disco" class="disco-img">
                        <img src="logo.png" alt="Logo Arte Registrazioni" class="logo-img">
                        <img src="sounds-logo.png" alt="Logo Sounds" class="sounds-logo-img">
                    </div>
                </div>
                <nav class="navbar">
                    <ul>
                        <li><a href="index.html" class="active">Home</a></li>
                        <li><a href="artisti.html">Artisti</a></li>
                        <li><a href="contatti.html">Contatti</a></li>
                    </ul>
                </nav>
                <div class="panel box-gap">
                    <a href="PaginaStudio/artestudio.html" class="glow-btn"><h1 class="home-title">Arte Registrazioni</h1></a>
                </div>
                <video src="videopromo.mp4" autoplay controls class="promo-video" poster="logo.png"></video>

                <!-- SOCIAL SOUNDS — card orizzontale stile Stories -->
                <section id="social-sounds" class="social-sounds" aria-labelledby="social-title">
                    <div class="social-card">
                        <div class="social-head">
                            <h2 id="social-title" class="social-title">SOCIAL SOUNDS</h2>
                            <p class="social-sub">Posta il tuo concerto. Fatti trovare. Suona insieme.</p>
                        </div>

                        <div class="social-icons" role="list" aria-label="Funzioni principali">
                            <a class="social-icon megaphone" href="/social#live" role="listitem" aria-label="Annuncia live">
                                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M3 11l12-6v14L3 13V11Z" stroke="#60a5fa" stroke-width="1.6" stroke-linejoin="round"/>
                                    <path d="M8 14.5 7 20" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round"/>
                                    <path d="M18 8c1.2.8 2 2.1 2 3.6s-.8 2.8-2 3.6" stroke="#60a5fa" stroke-width="1.6" stroke-linecap="round"/>
                                </svg>
                                <span>Live</span>
                            </a>

                            <a class="social-icon map" href="/social#map" role="listitem" aria-label="Eventi vicino a te">
                                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M12 2C8.7 2 6 4.7 6 8c0 4.5 6 12 6 12s6-7.5 6-12c0-3.3-2.7-6-6-6Zm0 8a2 2 0 1 1 0-4 2 2 0 0 1 0 4Z" stroke="#60a5fa" stroke-width="1.6"/>
                                </svg>
                                <span>Eventi</span>
                                <span class="ping" aria-hidden="true"></span>
                            </a>

                            <a class="social-icon chat" href="/social#rsvp" role="listitem" aria-label="RSVP e chat">
                                <svg width="56" height="56" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                                    <path d="M4 6h16v9a3 3 0 0 1-3 3H9l-5 3V6Z" stroke="#60a5fa" stroke-width="1.6" stroke-linejoin="round"/>
                                    <circle cx="9" cy="11" r="1" fill="#60a5fa"/>
                                    <circle cx="12" cy="11" r="1" fill="#60a5fa"/>
                                    <circle cx="15" cy="11" r="1" fill="#60a5fa"/>
                                </svg>
                                <span>RSVP</span>
                            </a>
                        </div>

                        <div class="social-cta">
                            <a class="btn btn-join" href="/social">Entra ora</a>
                        </div>
                    </div>
                </section>
            </div>
<style>
/* SOCIAL SOUNDS — dark, mobile‑first, stile “Stories” (vanilla) */
.social-sounds{padding:24px 16px 4px;color:#f3f7ff;background:transparent}
.social-sounds .social-card{position:relative;max-width:1200px;margin:0 auto;border-radius:18px;padding:22px 20px 24px;background:linear-gradient(180deg,#161b22,#0d1117);border:1px solid rgba(77,163,255,.70);box-shadow:0 0 0 3px rgba(77,163,255,.22),0 24px 60px rgba(0,0,0,.55),inset 0 0 0 1px rgba(255,255,255,.03);overflow:hidden}
.social-sounds .social-card::before{content:"";position:absolute;inset:-1px;border-radius:18px;z-index:-1;background:radial-gradient(70% 60% at 10% 0%,rgba(77,163,255,.28),rgba(0,0,0,0) 60%);filter:blur(22px)}
.social-sounds .social-title{margin:0;font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;font-weight:800;font-size:28px;letter-spacing:.8px;color:#fff;text-shadow:0 0 12px rgba(77,163,255,.35)}
.social-sounds .social-sub{margin:6px 0 0;color:#dbe7ff;font-weight:600;opacity:.95}
.social-sounds .social-icons{display:flex;gap:12px;flex-wrap:nowrap;overflow-x:auto;padding:12px 2px 2px;margin-top:12px;scrollbar-width:thin}
.social-sounds .social-icons::-webkit-scrollbar{height:8px}
.social-sounds .social-icons::-webkit-scrollbar-thumb{background:rgba(77,163,255,.25);border-radius:8px}
.social-sounds .social-icon{position:relative;display:inline-flex;align-items:center;gap:10px;padding:14px 16px;border:1px solid rgba(77,163,255,.45);border-radius:14px;background:rgba(77,163,255,.08);color:#fff;font-weight:800;text-decoration:none;box-shadow:inset 0 0 0 1px rgba(255,255,255,.04),0 8px 28px rgba(0,0,0,.35);transition:transform .2s ease,box-shadow .2s ease}
.social-sounds .social-icon:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(255,255,255,.06),0 12px 34px rgba(0,0,0,.45)}
.social-sounds .social-icon .ping{position:absolute;right:-8px;top:-8px;width:14px;height:14px;border-radius:50%;background:#60a5fa;box-shadow:0 0 0 0 rgba(96,165,250,.7);animation:ping 1.6s infinite}
.social-sounds .social-cta{margin-top:18px;display:flex;justify-content:flex-start}
.social-sounds .btn.btn-join{display:inline-flex;align-items:center;justify-content:center;min-width:160px;padding:12px 18px;border-radius:12px;font-weight:900;color:#06230f;background:linear-gradient(180deg,#22c55e,#16a34a);border:1px solid rgba(34,197,94,.55);box-shadow:0 10px 32px rgba(34,197,94,.36),inset 0 0 0 1px rgba(255,255,255,.08);text-decoration:none;transition:transform .15s ease,box-shadow .2s ease}
.social-sounds .btn.btn-join:hover{transform:translateY(-2px);box-shadow:0 16px 42px rgba(34,197,94,.46)}
@keyframes bounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes wiggle{0%,100%{transform:rotate(0)}35%{transform:rotate(-4deg)}65%{transform:rotate(4deg)}}
@keyframes ping{0%{box-shadow:0 0 0 0 rgba(96,165,250,.7)}80%,100%{box-shadow:0 0 0 18px rgba(96,165,250,0)}}
.social-sounds .social-card:not(.is-live) .social-icon{animation-play-state:paused}
.social-sounds .social-card.is-live .social-icon.megaphone{animation:bounce 1.8s ease-in-out infinite}
.social-sounds .social-card.is-live .social-icon.chat{animation:wiggle 2.2s ease-in-out infinite}
@media (min-width:768px){.social-sounds{padding:28px 20px 6px}.social-sounds .social-card{padding:24px 24px 26px}.social-sounds .social-icons{gap:16px;overflow:visible}}
</style>

<script>
// Abilita le animazioni solo quando la card entra in viewport (no framework)
(function(){
    const card=document.querySelector('.social-sounds .social-card');
    if(!card) return; const prefersReduced=window.matchMedia('(prefers-reduced-motion: reduce)').matches; const start=()=>card.classList.add('is-live'); if(prefersReduced) return;
    if('IntersectionObserver' in window){ const io=new IntersectionObserver((entries)=>{ for(const e of entries){ if(e.isIntersecting){ start(); io.disconnect(); break; } } },{threshold:0.25}); io.observe(card);} else { start(); }
})();
</script>

<script src="lazy.js" defer></script>
</body>
</html>
